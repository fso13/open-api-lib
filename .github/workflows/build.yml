name: build

# Сборка и тесты. Интеграционные тесты поднимают PostgreSQL через Testcontainers,
# поэтому job выполняется на ubuntu-раннере с уже доступным Docker.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/test
            */build/reports/jacoco
          if-no-files-found: ignore
