<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body class="error-body">
<main class="error-wrap">
    <div class="card error-card">
        <div class="error-code" th:text="${status} ?: 500">500</div>
        <h1>Что-то пошло не так</h1>
        <p class="muted" th:text="${error} ?: 'Внутренняя ошибка приложения'">Внутренняя ошибка приложения</p>
        <p class="muted small" th:if="${path}">Запрошенный путь: <code th:text="${path}">/ui/tokens</code></p>
        <div class="form-actions">
            <a class="btn btn-primary" th:href="@{/}">На главную</a>
        </div>
    </div>
</main>
</body>
</html>
