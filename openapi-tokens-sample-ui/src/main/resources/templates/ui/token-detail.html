<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Токен')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('user')}"></header>

<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="${token.name}">ci-bot</h1>
            <p class="muted">Префикс <code th:text="${token.prefix}">abcd1234</code></p>
        </div>
        <div class="page-actions">
            <a class="btn btn-ghost" th:href="@{/ui/tokens}">К списку</a>
            <form th:if="${token.status != 'REVOKED'}"
                  th:action="@{/ui/tokens/{id}/revoke(id=${token.id})}" method="post"
                  onsubmit="return confirm('Отозвать токен? Действие необратимо.');">
                <button class="btn btn-danger" type="submit">Отозвать</button>
            </form>
        </div>
    </div>

    <div class="card">
        <h2>Параметры</h2>
        <dl th:replace="~{fragments/layout :: tokenMeta(${token}, false)}"></dl>
    </div>

    <h2>Использование</h2>
    <div th:replace="~{fragments/layout :: usageCards(${usage})}"></div>

    <h2>Журнал аудита <span class="muted small">последние 50 записей</span></h2>
    <div th:replace="~{fragments/layout :: auditTable(${audit})}"></div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
