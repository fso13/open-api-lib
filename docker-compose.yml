services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openapi_tokens
      POSTGRES_USER: openapi
      POSTGRES_PASSWORD: openapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openapi -d openapi_tokens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- keycloak-семпл: docker compose --profile keycloak up -d ---

  postgres-keycloak:
    image: postgres:16-alpine
    profiles: ["keycloak"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: openapi_tokens_keycloak
      POSTGRES_USER: openapi
      POSTGRES_PASSWORD: openapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openapi -d openapi_tokens_keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["keycloak"]
    command:
      - start-dev
      - --http-port=8180
      - --import-realm
    ports:
      - "8180:8180"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./openapi-tokens-sample-keycloak/docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 && echo -e 'GET /realms/openapi-tokens/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
